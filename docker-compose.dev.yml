version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres-dev
    environment:
      POSTGRES_DB: reachinbox
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - reachinbox-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - reachinbox-dev-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  reachinbox-dev-network:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
