version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    restart: always
    environment:
      POSTGRES_DB: reachinbox
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reachinbox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reachinbox-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: reachinbox-backend
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://reachinbox:reachinbox_password@postgres:5432/reachinbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:5001/api/auth/google/callback
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-reachinbox-2026}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      MIN_DELAY_BETWEEN_EMAILS_MS: ${MIN_DELAY_BETWEEN_EMAILS_MS:-2000}
      MAX_EMAILS_PER_HOUR: ${MAX_EMAILS_PER_HOUR:-200}
      MAX_CSV_SIZE_MB: ${MAX_CSV_SIZE_MB:-5}
      FRONTEND_URL: http://localhost:3000
      EMAIL_SEND_MODE: ${EMAIL_SEND_MODE:-ethereal}
      LOG_LEVEL: info
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reachinbox-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: reachinbox-worker
    restart: always
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://reachinbox:reachinbox_password@postgres:5432/reachinbox
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      MIN_DELAY_BETWEEN_EMAILS_MS: ${MIN_DELAY_BETWEEN_EMAILS_MS:-2000}
      MAX_EMAILS_PER_HOUR: ${MAX_EMAILS_PER_HOUR:-200}
      EMAIL_SEND_MODE: ${EMAIL_SEND_MODE:-ethereal}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reachinbox-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: reachinbox-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - reachinbox-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: reachinbox-redisinsight
    restart: always
    ports:
      - "5540:5540"
    networks:
      - reachinbox-network

networks:
  reachinbox-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
